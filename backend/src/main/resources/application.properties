spring.application.name=keian-backend

# The backend runs here. Your website (Vite) already forwards /api to this port.
server.port=8080

# Database (started by docker-compose.yml). The values after ":" are the local defaults.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/keian}
spring.datasource.username=${DB_USER:keian}
spring.datasource.password=${DB_PASSWORD:keian_local}

# Creates and updates the database tables from the Java classes automatically.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
